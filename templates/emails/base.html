<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}SAT Duel{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f4f2ff;color:#1e293b;font-family:Arial,Helvetica,sans-serif;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{% block preheader %}{% endblock %}</div>
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4f2ff;">
    <tr>
        <td align="center" style="padding:32px 16px;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;background:#ffffff;border:1px solid #e4e0ff;border-radius:20px;overflow:hidden;box-shadow:0 12px 32px rgba(76,55,160,.10);">
                <tr>
                    <td style="padding:25px 32px;background:#5b4bdb;">
                        <table role="presentation" cellspacing="0" cellpadding="0" border="0">
                            <tr>
                                <td style="vertical-align:middle;">
                                    <div style="width:48px;height:48px;background:#ffffff;border-radius:14px;text-align:center;line-height:48px;">
                                        <img src="{{ logo_url }}" width="40" height="40" alt="SAT Duel" style="display:inline-block;vertical-align:middle;border:0;">
                                    </div>
                                </td>
                                <td style="padding-left:14px;vertical-align:middle;">
                                    <div style="font-size:21px;line-height:26px;font-weight:800;color:#ffffff;letter-spacing:-.3px;">SAT Duel</div>
                                    <div style="font-size:12px;line-height:18px;color:#ddd8ff;">Practice smarter. Compete together.</div>
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:38px 32px 34px;">
                        {% block content %}{% endblock %}
                    </td>
                </tr>
                <tr>
                    <td style="padding:22px 32px;background:#f8fafc;border-top:1px solid #e2e8f0;text-align:center;">
                        <p style="margin:0 0 7px;font-size:12px;line-height:18px;color:#64748b;">SAT Duel · Competitive Digital SAT practice</p>
                        <p style="margin:0;font-size:12px;line-height:18px;color:#94a3b8;">Need help? <a href="mailto:{{ support_email }}" style="color:#5b4bdb;text-decoration:none;font-weight:700;">{{ support_email }}</a></p>
                    </td>
                </tr>
            </table>
            <p style="margin:18px 0 0;font-size:11px;line-height:17px;color:#94a3b8;">This is an essential account email, not a marketing message.</p>
        </td>
    </tr>
</table>
</body>
</html>
